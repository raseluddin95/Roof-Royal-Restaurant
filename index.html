<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roof Royal Restaurant | Rooftop Dining in Jhenaidah</title>
    <meta name="description" content="Experience premium rooftop dining at Roof Royal Restaurant, Jhenaidah. View our digital QR menu and order online.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--bg-dark:#0f0f12;--card-bg:rgba(24,24,30,0.75);--gold:#dfb76c;--gold-hover:#f3cf8a;--text-light:#f5f5f7;--text-muted:#a1a1aa;--border-glass:rgba(223,183,108,0.15);--radius:16px;--transition:all 0.3s cubic-bezier(0.4,0,0.2,1);}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        html{scroll-behavior:smooth;}
        body{font-family:'Poppins',sans-serif;background-color:var(--bg-dark);color:var(--text-light);line-height:1.6;overflow-x:hidden;padding-bottom:100px;}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:30px;font-weight:500;text-decoration:none;transition:var(--transition);cursor:pointer;border:none;font-family:'Poppins',sans-serif;}
        .btn-gold{background:linear-gradient(135deg,var(--gold),#b88e3d);color:#111;}
        .btn-gold:hover{background:linear-gradient(135deg,var(--gold-hover),var(--gold));transform:translateY(-2px);box-shadow:0 8px 20px rgba(223,183,108,0.3);}
        .btn-outline{background:transparent;border:1px solid var(--border-glass);color:var(--text-light);}
        .btn-outline:hover{background:rgba(255,255,255,0.05);border-color:var(--gold);}
        .section-title{font-family:'Playfair Display',serif;font-size:2rem;color:var(--gold);text-align:center;margin-bottom:30px;position:relative;}
        .section-title::after{content:'';display:block;width:50px;height:2px;background:var(--gold);margin:10px auto 0;}
        .glass-panel{background:var(--card-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border-glass);border-radius:var(--radius);}

        header{position:relative;height:65vh;min-height:450px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:linear-gradient(rgba(15,15,18,0.6),rgba(15,15,18,0.95)),url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;}
        .hero-content h1{font-family:'Playfair Display',serif;font-size:3rem;color:var(--gold);margin-bottom:10px;letter-spacing:1px;}
        .hero-content p{font-size:1.1rem;color:var(--text-muted);margin-bottom:30px;}

        .info-section{padding:30px 20px;margin:-50px 20px 40px;position:relative;z-index:10;}
        .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;text-align:center;}
        .info-item i{font-size:1.5rem;color:var(--gold);margin-bottom:10px;}
        .info-item p{font-size:0.95rem;}
        .info-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px;padding-top:20px;border-top:1px solid var(--border-glass);}
        .info-actions .btn{font-size:0.85rem;padding:10px 18px;}

        /* OFFERS (Multi-line/Vertical stack for mobile) */
        .offers-section{padding:0 20px 40px; text-align:center;}
        .offer-slider{display:flex;flex-direction:column;gap:15px;padding-bottom:15px;}
        .offer-card{width:100%;display:flex;gap:12px;padding:15px;background:linear-gradient(135deg,rgba(223,183,108,0.12) 0%,rgba(24,24,30,0.85) 100%);position:relative;border-radius:var(--radius);border:1px solid var(--border-glass);align-items:center;text-align:left;}
        .offer-left{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;height:100%;}
        .offer-badge{align-self:flex-start;background:#e11d48;color:white;font-size:0.7rem;font-weight:600;padding:3px 8px;border-radius:8px;margin-bottom:6px;}
        .offer-card h3{color:var(--gold);margin-bottom:4px;font-size:1rem;white-space:normal;overflow:visible;}
        .offer-card p{font-size:0.78rem;color:var(--text-muted);margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
        .offer-meta-box{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px;}
        .offer-price{color:var(--gold);font-weight:600;font-size:1.05rem;}
        .offer-select-tag{font-size:0.72rem;color:var(--gold);opacity:0.9;border:1px solid rgba(223,183,108,0.3);padding:3px 8px;border-radius:12px;white-space:nowrap;}
        .offer-right{width:95px;height:95px;flex-shrink:0;}
        .offer-img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--border-glass);aspect-ratio:1/1;}
        .offer-card.item-sold-out{opacity:0.5;}

        /* MENU TABS & CARDS (Multi-line layout) */
        .menu-container{padding:0 20px 40px;}
        .category-tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-bottom:15px;margin-bottom:30px;}
        .tab-btn{padding:8px 16px;border-radius:20px;background:rgba(255,255,255,0.05);border:1px solid rgba(223,183,108,0.1);color:var(--text-muted);white-space:normal;text-align:center;font-size:0.85rem;cursor:pointer;transition:var(--transition);font-family:'Poppins',sans-serif;}
        .tab-btn.active{background:var(--gold);color:#111;font-weight:500;border-color:var(--gold);}
        
        .menu-grid{display:none;grid-template-columns:1fr;gap:15px;}
        .menu-grid.active{display:grid;animation:fadeIn 0.4s ease-in-out;}
        .menu-card{display:flex;gap:15px;padding:15px;align-items:center;cursor:pointer;transition:var(--transition);position:relative;overflow:hidden;}
        .menu-card:hover{border-color:rgba(223,183,108,0.4);transform:translateY(-2px);}
        .menu-card.item-sold-out{opacity:0.55;cursor:not-allowed;}
        
        .menu-img-wrapper{position:relative;width:90px;height:90px;flex-shrink:0;}
        .menu-img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:1px solid var(--border-glass);}
        .menu-card-badge{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:#dfb76c;color:#111;font-size:0.65rem;font-weight:600;padding:2px 8px;border-radius:8px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.4);}
        .menu-card-badge.soldout-badge{background:#e11d48;color:#fff;}
        
        .menu-details{flex:1;min-width:0;}
        .menu-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;gap:10px;}
        .menu-title{font-size:1rem;font-weight:600;color:var(--text-light);white-space:normal;overflow:visible;}
        .menu-price{color:var(--gold);font-weight:600;font-size:1.1rem;flex-shrink:0;}
        .menu-desc{font-size:0.8rem;color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
        .tap-order-tag{font-size:0.75rem;color:var(--gold);margin-top:7px;display:block;opacity:0.85;}
        .tap-order-tag.soldout-text{color:#e11d48;font-weight:500;}

        /* CART & CHECKOUT AREA */
        .cart-table{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:0.88rem;}
        .cart-table th{text-align:left;color:var(--text-muted);padding-bottom:10px;border-bottom:1px solid var(--border-glass);font-weight:500;}
        .cart-table td{padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.03);vertical-align:middle;}
        .cart-item-info div{font-weight:500;color:var(--text-light);}
        .cart-item-info span{font-size:0.75rem;color:var(--text-muted);}
        .cart-qty-box{display:inline-flex;align-items:center;background:rgba(255,255,255,0.05);border-radius:15px;padding:3px 8px;gap:8px;}
        .cart-qty-btn{background:none;border:none;color:var(--gold);cursor:pointer;font-size:0.9rem;padding:0 2px;}
        .cart-qty-num{font-weight:600;min-width:14px;text-align:center;}
        .cart-remove{background:none;border:none;color:#e11d48;cursor:pointer;font-size:0.95rem;margin-left:8px;}
        .empty-cart-msg{text-align:center;color:var(--text-muted);padding:30px 10px;font-size:0.9rem;}

        /* FLOATING CART BAR */
        .floating-cart-bar{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:calc(100% - 40px);max-width:450px;background:linear-gradient(135deg,#b88e3d,var(--gold));color:#111;z-index:150;padding:14px 20px;border-radius:30px;justify-content:between;align-items:center;box-shadow:0 8px 25px rgba(0,0,0,0.5);text-decoration:none;font-weight:600;animation:slideUp 0.3s cubic-bezier(0.4,0,0.2,1);justify-content:space-between;}
        .floating-cart-bar.show{display:flex;}
        .floating-cart-bar i{font-size:1.1rem;}

        /* POPUP MODAL (Common) */
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:2000;align-items:flex-end;justify-content:center;}
        .modal-overlay.open{display:flex;animation:fadeIn 0.2s ease;}
        .modal-box{background:#111622;border:1px solid var(--border-glass);border-radius:20px 20px 0 0;padding:28px 22px 35px;width:100%;max-width:440px;animation:slideUp 0.3s cubic-bezier(0.4,0,0.2,1);max-height:85vh;overflow-y:auto;position:relative;}
        .modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
        .modal-item-name{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--gold);}
        .modal-item-price{color:var(--text-muted);font-size:0.9rem;}
        .modal-close{background:rgba(255,255,255,0.08);border:none;color:var(--text-muted);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--transition);}

        /* Developer Popup Style */
        .dev-modal-content{text-align:center;padding:10px 5px;}
        .dev-icon{font-size:3.5rem;color:#f06a38;margin-bottom:15px;}
        .dev-name{font-size:1.6rem;font-weight:600;color:#f06a38;margin-bottom:12px;font-family:'Poppins',sans-serif;}
        .dev-desc{font-size:0.95rem;color:var(--text-light);margin-bottom:10px;line-height:1.5;font-weight:300;}
        .dev-question{font-size:0.95rem;color:var(--text-light);margin-bottom:20px;line-height:1.5;font-weight:300;}
        
        .dev-phone-box{background:rgba(255,255,255,0.04);border-radius:30px;padding:12px;margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--text-light);font-size:1.15rem;font-weight:600;}
        .dev-phone-box i{color:#25D366;}
        
        .btn-dev-contact{background:#f06a38;color:white;width:100%;font-weight:500;padding:14px;border-radius:30px;font-size:1rem;margin-bottom:20px;}
        .btn-dev-contact:hover{background:#d9592b;transform:translateY(-2px);box-shadow:0 6px 15px rgba(240,106,56,0.3);}
        
        .dev-tags{font-size:0.82rem;color:var(--text-muted);display:flex;align-items:center;justify-content:center;gap:6px;}
        .dev-tags i{color:#0284c7;}

        .qty-row{display:flex;align-items:center;background:rgba(255,255,255,0.04);border-radius:12px;padding:10px 14px;margin-bottom:20px;}
        .qty-label{font-size:0.85rem;color:var(--text-muted);}
        .qty-controls{display:flex;align-items:center;gap:12px;margin-left:auto;}
        .qty-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid var(--border-glass);color:var(--text-light);font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
        .qty-num{font-size:1.1rem;font-weight:600;min-width:26px;text-align:center;}

        .delivery-toggle{display:flex;gap:0;margin-bottom:14px;border-radius:10px;overflow:hidden;border:1px solid var(--border-glass);}
        .dtoggle-btn{flex:1;padding:11px;background:rgba(255,255,255,0.04);border:none;color:var(--text-muted);font-family:'Poppins',sans-serif;font-size:0.88rem;cursor:pointer;transition:var(--transition);}
        .dtoggle-btn.active{background:var(--gold);color:#111;font-weight:600;}

        .form-group{margin-bottom:13px;}
        .form-group label{display:block;font-size:0.82rem;color:var(--text-muted);margin-bottom:5px;}
        .form-control{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border-glass);padding:11px 14px;border-radius:10px;color:var(--text-light);font-family:'Poppins',sans-serif;font-size:0.92rem;}
        .form-control:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,0.08);}

        .modal-total{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-top:1px solid var(--border-glass);margin-top:10px;}
        .modal-total span
